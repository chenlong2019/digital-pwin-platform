[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-render-service"
version = "0.1.0"
description = "Neural rendering service boundary for the digital twin simulation platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
